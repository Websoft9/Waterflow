groups:
  linux-amd64:
    servers:
      - agent_id: agent-001
        hostname: build-server-1.example.com
        ip_address: 192.168.1.10
        task_queues:
          - linux-amd64
          - linux-common
        metadata:
          os: linux
          arch: amd64
          datacenter: us-west
      
      - agent_id: agent-002
        hostname: build-server-2.example.com
        ip_address: 192.168.1.11
        task_queues:
          - linux-amd64
          - linux-common
        metadata:
          os: linux
          arch: amd64
          datacenter: us-east
  
  web-servers:
    servers:
      - agent_id: agent-web-1
        hostname: web-1.example.com
        ip_address: 10.0.1.20
        task_queues:
          - web-servers
        metadata:
          role: web
          environment: production
      
      - agent_id: agent-web-2
        hostname: web-2.example.com
        ip_address: 10.0.1.21
        task_queues:
          - web-servers
        metadata:
          role: web
          environment: production
