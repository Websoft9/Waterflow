services:
  # PostgreSQL Database (Temporal dependency)
  postgresql:
    image: postgres:${POSTGRESQL_VERSION:-16}
    container_name: waterflow-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal}" ]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s
    networks:
      - waterflow-network
    restart: unless-stopped

  # Temporal Admin Tools - 用于初始化数据库
  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    container_name: waterflow-temporal-admin-tools
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - SQL_PASSWORD=temporal
    networks:
      - waterflow-network
    volumes:
      - ./scripts:/scripts
    entrypoint: [ "/bin/sh" ]
    command: /scripts/setup-postgres.sh

  # Temporal Server
  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.29.2}
    container_name: waterflow-temporal
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    networks:
      - waterflow-network
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "7233" ]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60

  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    container_name: waterflow-temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    networks:
      - waterflow-network
    volumes:
      - ./scripts:/scripts
    entrypoint: [ "/bin/sh" ]
    command: /scripts/create-namespace.sh

  waterflow:
    build:
      context: ..
      dockerfile: build/Dockerfile.server
    image: waterflow/server:${WATERFLOW_SERVER_IMAGE_TAG:-latest}
    container_name: waterflow-server
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      # Server Configuration
      WATERFLOW_SERVER_HOST: ${WATERFLOW_SERVER_HOST:-0.0.0.0}
      WATERFLOW_SERVER_PORT: ${WATERFLOW_SERVER_PORT:-8080}

      # Temporal Configuration 
      WATERFLOW_TEMPORAL_HOST: ${WATERFLOW_TEMPORAL_HOST:-temporal:7233}
      WATERFLOW_TEMPORAL_NAMESPACE: ${WATERFLOW_TEMPORAL_NAMESPACE:-default}
      WATERFLOW_TEMPORAL_TASKQUEUE: ${WATERFLOW_TEMPORAL_TASKQUEUE:-waterflow-server}
      WATERFLOW_LOG_LEVEL: ${WATERFLOW_LOG_LEVEL:-info}
      WATERFLOW_LOG_FORMAT: ${WATERFLOW_LOG_FORMAT:-json}

      # Database Configuration (for workflow definitions storage)
      WATERFLOW_DATABASE_ENABLED: ${WATERFLOW_DATABASE_ENABLED:-true}
      WATERFLOW_DATABASE_HOST: ${WATERFLOW_DATABASE_HOST:-postgresql}
      WATERFLOW_DATABASE_PORT: ${WATERFLOW_DATABASE_PORT:-5432}
      WATERFLOW_DATABASE_USER: ${WATERFLOW_DATABASE_USER:-temporal}
      WATERFLOW_DATABASE_PASSWORD: ${WATERFLOW_DATABASE_PASSWORD:-temporal}
      WATERFLOW_DATABASE_DATABASE: ${WATERFLOW_DATABASE_DATABASE:-waterflow}
      WATERFLOW_DATABASE_SSLMODE: ${WATERFLOW_DATABASE_SSLMODE:-disable}
    ports:
      - "${WATERFLOW_SERVER_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - waterflow-network
    restart: unless-stopped

  # Temporal UI (开发/调试用)
  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.44.0}
    container_name: waterflow-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8088}
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"
    networks:
      - waterflow-network
    restart: unless-stopped

  # Waterflow Agent - Linux AMD64 (Instance 1)
  # 注意：配置文件是可选的，Agent 支持完全环境变量驱动
  # 如需使用配置文件，可添加 volume 挂载：
  # volumes:
  #   - ./agent-config.yaml:/app/config/config.yaml:ro
  agent-linux-1:
    build:
      context: ..
      dockerfile: build/Dockerfile.agent
    image: waterflow/agent:${WATERFLOW_AGENT_IMAGE_TAG:-latest}
    container_name: waterflow-agent-linux-1
    depends_on:
      waterflow:
        condition: service_healthy
    environment:
      # 连接内部 Temporal 服务（通过内部网络）
      WATERFLOW_TEMPORAL_HOST: temporal:7233
      WATERFLOW_TEMPORAL_NAMESPACE: ${WATERFLOW_TEMPORAL_NAMESPACE:-default}
      WATERFLOW_AGENT_TASK_QUEUES: ${AGENT_TASK_QUEUES:-linux-amd64,linux-common}
      WATERFLOW_LOG_LEVEL: ${AGENT_LOG_LEVEL:-info}
      WATERFLOW_AGENT_ID: agent-linux-1
    volumes:
      - agent-plugins:/app/plugins:ro
    healthcheck:
      test: [ "CMD-SHELL", "wget -q -O /dev/null http://localhost:6061/debug/pprof/ || exit 1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - waterflow-network
    restart: unless-stopped

volumes:
  postgresql-data:
  agent-plugins:


networks:
  waterflow-network:
    driver: bridge
