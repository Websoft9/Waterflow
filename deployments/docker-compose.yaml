services:
  # PostgreSQL Database (Temporal dependency)
  postgresql:
    image: postgres:15-alpine
    container_name: waterflow-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${POSTGRES_DB:-temporal}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U temporal" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - waterflow-network
    restart: unless-stopped
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false # PostgreSQL needs write access to data directory
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Temporal Server (内部服务，不对外暴露)
  temporal:
    image: temporalio/auto-setup:1.22.0
    container_name: waterflow-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgresql
      SKIP_DB_CREATE: "false"
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
      ENABLE_ES: "false"
      LOG_LEVEL: ${TEMPORAL_LOG_LEVEL:-info}
    # ⚠️ 不暴露端口给宿主机，仅内部网络通信
    # ports:
    #   - "7233:7233"  # 已注释：不对外开放
    healthcheck:
      test: [ "CMD", "sh", "-c", "nc -z $(hostname -i) 7233" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - waterflow-network
    restart: unless-stopped
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: false # Temporal needs write access for state management
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G

  # Waterflow Server (连接到内部 Temporal)
  waterflow:
    build:
      context: ..
      dockerfile: build/Dockerfile.server
    image: waterflow/server:${WATERFLOW_SERVER_IMAGE_TAG:-latest}
    container_name: waterflow-server
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      # Server Configuration
      WATERFLOW_SERVER_HOST: ${WATERFLOW_SERVER_HOST:-0.0.0.0}
      WATERFLOW_SERVER_PORT: ${WATERFLOW_SERVER_PORT:-8080}

      # Temporal Configuration (连接内部服务)
      WATERFLOW_TEMPORAL_HOST: ${WATERFLOW_TEMPORAL_HOST:-temporal:7233}
      WATERFLOW_TEMPORAL_NAMESPACE: ${WATERFLOW_TEMPORAL_NAMESPACE:-default}
      WATERFLOW_TEMPORAL_TASKQUEUE: ${WATERFLOW_TEMPORAL_TASKQUEUE:-waterflow-server}
      WATERFLOW_LOG_LEVEL: ${WATERFLOW_LOG_LEVEL:-info}
      WATERFLOW_LOG_FORMAT: ${WATERFLOW_LOG_FORMAT:-json}
    ports:
      - "${WATERFLOW_SERVER_PORT:-8080}:8080" # 只暴露 Waterflow API
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - waterflow-network
    restart: unless-stopped
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Temporal UI (开发/调试用)
  temporal-ui:
    image: temporalio/ui:2.22.0
    container_name: waterflow-temporal-ui
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8088}
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080" # UI 容器内监听 8080,映射到宿主机 8088
    networks:
      - waterflow-network
    restart: unless-stopped

  # Waterflow Agent - Linux AMD64 (Instance 1)
  # 注意：配置文件是可选的，Agent 支持完全环境变量驱动
  # 如需使用配置文件，可添加 volume 挂载：
  # volumes:
  #   - ./agent-config.yaml:/app/config/config.yaml:ro
  agent-linux-1:
    build:
      context: ..
      dockerfile: build/Dockerfile.agent
    image: waterflow/agent:${WATERFLOW_AGENT_IMAGE_TAG:-latest}
    container_name: waterflow-agent-linux-1
    depends_on:
      waterflow:
        condition: service_healthy
    environment:
      # 连接内部 Temporal 服务（通过内部网络）
      WATERFLOW_TEMPORAL_HOST: temporal:7233
      WATERFLOW_TEMPORAL_NAMESPACE: ${WATERFLOW_TEMPORAL_NAMESPACE:-default}
      WATERFLOW_AGENT_TASK_QUEUES: ${AGENT_TASK_QUEUES:-linux-amd64,linux-common}
      WATERFLOW_LOG_LEVEL: ${AGENT_LOG_LEVEL:-info}
      WATERFLOW_AGENT_ID: agent-linux-1
    volumes:
      - agent-plugins:/app/plugins:ro
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:9090/metrics", "||", "exit", "1" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - waterflow-network
    restart: unless-stopped
    # Security options
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,nodev
      - /app/logs:noexec,nosuid,nodev
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

volumes:
  postgresql-data:
    driver: local
  agent-plugins:
    driver: local

networks:
  waterflow-network:
    driver: bridge
