services:
  # PostgreSQL Database (Temporal dependency)
  postgresql:
    image: postgres:15-alpine
    container_name: waterflow-postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_DB: ${POSTGRES_DB:-temporal}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U temporal" ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - waterflow-network
    restart: unless-stopped

  # Temporal Server (内部服务，不对外暴露)
  temporal:
    image: temporalio/auto-setup:1.22.0
    container_name: waterflow-temporal
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgresql
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgresql
      SKIP_DB_CREATE: "false"
      SKIP_DEFAULT_NAMESPACE_CREATION: "false"
      ENABLE_ES: "false"
      LOG_LEVEL: ${TEMPORAL_LOG_LEVEL:-info}
    # ⚠️ 不暴露端口给宿主机，仅内部网络通信
    # ports:
    #   - "7233:7233"  # 已注释：不对外开放
    healthcheck:
      test: [ "CMD", "sh", "-c", "nc -z $(hostname -i) 7233" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - waterflow-network
    restart: unless-stopped

  # Waterflow Server (连接到内部 Temporal)
  waterflow:
    build:
      context: ..
      dockerfile: build/Dockerfile.server
    image: waterflow:latest
    container_name: waterflow-server
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      # Server Configuration
      WATERFLOW_SERVER_HOST: ${WATERFLOW_SERVER_HOST:-0.0.0.0}
      WATERFLOW_SERVER_PORT: ${WATERFLOW_SERVER_PORT:-8080}

      # Temporal Configuration (连接内部服务)
      WATERFLOW_TEMPORAL_HOST: ${WATERFLOW_TEMPORAL_HOST:-temporal:7233}
      WATERFLOW_TEMPORAL_NAMESPACE: ${WATERFLOW_TEMPORAL_NAMESPACE:-default}
      WATERFLOW_TEMPORAL_TASKQUEUE: ${WATERFLOW_TEMPORAL_TASKQUEUE:-waterflow-server}
      WATERFLOW_LOG_LEVEL: ${WATERFLOW_LOG_LEVEL:-info}
      WATERFLOW_LOG_FORMAT: ${WATERFLOW_LOG_FORMAT:-json}
    ports:
      - "${WATERFLOW_SERVER_PORT:-8080}:8080" # 只暴露 Waterflow API
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - waterflow-network
    restart: unless-stopped

  # Waterflow Agent - Linux AMD64 (Instance 1)
  agent-linux-1:
    build:
      context: ..
      dockerfile: build/Dockerfile.agent
    image: waterflow/agent:latest
    container_name: waterflow-agent-linux-1
    depends_on:
      waterflow:
        condition: service_healthy
    environment:
      # 连接内部 Temporal 服务（通过内部网络）
      TEMPORAL_SERVER_URL: temporal:7233
      TEMPORAL_NAMESPACE: ${WATERFLOW_TEMPORAL_NAMESPACE:-default}
      TASK_QUEUES: linux-amd64,linux-common
      LOG_LEVEL: ${AGENT_LOG_LEVEL:-info}
      AGENT_ID: agent-linux-1
    volumes:
      - agent-plugins:/app/plugins:ro
    networks:
      - waterflow-network
    restart: unless-stopped

volumes:
  postgresql-data:
    driver: local
  agent-plugins:
    driver: local

networks:
  waterflow-network:
    driver: bridge
