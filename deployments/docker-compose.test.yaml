# Docker Compose configuration for integration testing
# Lightweight setup with minimal resource usage
# Usage: docker compose -f deployments/docker-compose.test.yaml up -d

services:
  # PostgreSQL Database (Temporal dependency)
  postgresql:
    image: postgres:15-alpine
    container_name: waterflow-test-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
      POSTGRES_DB: temporal
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U temporal" ]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - waterflow-test-network
    tmpfs:
      - /var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Temporal Admin Tools - 初始化 DB schema (init 容器)
  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    container_name: waterflow-test-temporal-admin-tools
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
    networks:
      - waterflow-test-network
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  # Temporal Server
  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.29.2}
    container_name: waterflow-test-temporal
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: postgresql
      LOG_LEVEL: warn
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "7233" ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - waterflow-test-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # Temporal Create Namespace (init 容器)
  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    container_name: waterflow-test-temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: default
    networks:
      - waterflow-test-network
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  # Waterflow Server
  waterflow-server:
    build:
      context: ..
      dockerfile: build/Dockerfile.server
    image: waterflow/server:test
    container_name: waterflow-test-server
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully
    environment:
      WATERFLOW_SERVER_HOST: 0.0.0.0
      WATERFLOW_SERVER_PORT: 8080
      WATERFLOW_TEMPORAL_HOST: temporal:7233
      WATERFLOW_TEMPORAL_NAMESPACE: default
      WATERFLOW_TEMPORAL_TASKQUEUE: waterflow-test
      WATERFLOW_LOG_LEVEL: info
      WATERFLOW_LOG_FORMAT: json
    ports:
      - "18080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
    networks:
      - waterflow-test-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

  # Waterflow Agent
  waterflow-agent:
    build:
      context: ..
      dockerfile: build/Dockerfile.agent
    image: waterflow/agent:test
    container_name: waterflow-test-agent
    depends_on:
      waterflow-server:
        condition: service_healthy
    environment:
      WATERFLOW_TEMPORAL_HOST: temporal:7233
      WATERFLOW_TEMPORAL_NAMESPACE: default
      WATERFLOW_AGENT_TASK_QUEUES: linux-amd64,default,test-queue
      WATERFLOW_LOG_LEVEL: info
      WATERFLOW_AGENT_ID: test-agent-1
    networks:
      - waterflow-test-network
    # Agent needs docker socket for docker nodes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 256M

networks:
  waterflow-test-network:
    driver: bridge
    name: waterflow-test-network
