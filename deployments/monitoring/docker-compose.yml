version: '3.8'

services:
  prometheus:
    image: prom/prometheus:v2.45.0
    container_name: waterflow-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - waterflow-monitoring
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.0.3
    container_name: waterflow-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - waterflow-monitoring
    restart: unless-stopped
    depends_on:
      - prometheus
  # Waterflow Server (uncomment to run with monitoring)
  # waterflow-server:
  #   build:
  #     context: ../..
  #     dockerfile: build/Dockerfile.server
  #   container_name: waterflow-server
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     - WATERFLOW_TEMPORAL_HOST=temporal:7233
  #     - WATERFLOW_LOG_LEVEL=info
  #   networks:
  #     - waterflow-monitoring
  #   restart: unless-stopped

networks:
  waterflow-monitoring:
    driver: bridge

volumes:
  prometheus-data:
  grafana-data:
