global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'waterflow'
    environment: 'development'

scrape_configs:
  - job_name: 'waterflow-server'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'server'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'waterflow-agent'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'agent'
    metrics_path: '/metrics'
    scrape_interval: 15s

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
