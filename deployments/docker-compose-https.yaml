# Docker Compose with HTTPS/TLS Support
# This example demonstrates how to deploy Waterflow Server with HTTPS enabled

version: '3.8'

services:
  # Temporal Admin Tools - 初始化 DB schema (init 容器)
  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    container_name: waterflow-https-temporal-admin-tools
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    networks:
      - waterflow
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/setup-postgres.sh

  # Temporal Server (required for Waterflow)
  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.29.2}
    container_name: waterflow-https-temporal
    depends_on:
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
      - BIND_ON_IP=0.0.0.0
      - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7233"]
      interval: 5s
      timeout: 3s
      start_period: 30s
      retries: 60
    networks:
      - waterflow
    restart: unless-stopped

  # Temporal Create Namespace (init 容器)
  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    container_name: waterflow-https-temporal-create-namespace
    restart: on-failure:5
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DEFAULT_NAMESPACE=default
    networks:
      - waterflow
    volumes:
      - ./scripts:/scripts
    entrypoint: ["/bin/sh"]
    command: /scripts/create-namespace.sh

  # Temporal UI
  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.44.0}
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080" # Changed from 8088 to avoid conflict
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - waterflow

  # PostgreSQL Database
  postgresql:
    image: postgres:${POSTGRES_VERSION:-16}
    container_name: waterflow-https-postgresql
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - waterflow
    restart: unless-stopped

  # Waterflow Server with HTTPS
  waterflow-server:
    image: waterflow/server:latest
    ports:
      - "443:8443" # HTTPS port
      - "80:8080" # HTTP port (for redirect)
    volumes:
      # Mount TLS certificates
      - ./certs:/etc/waterflow/certs:ro
      # Optional: mount config file
      - ./config.yaml:/etc/waterflow/config.yaml:ro
    environment:
      # HTTPS Configuration
      - WATERFLOW_HTTPS_ENABLED=true
      - WATERFLOW_HTTPS_PORT=8443
      - WATERFLOW_HTTPS_CERT_FILE=/etc/waterflow/certs/server.crt
      - WATERFLOW_HTTPS_KEY_FILE=/etc/waterflow/certs/server.key
      - WATERFLOW_HTTPS_MIN_TLS_VERSION=1.2

      # HTTP Configuration (Optional redirect)
      - WATERFLOW_HTTP_ENABLED=true
      - WATERFLOW_HTTP_PORT=8080
      - WATERFLOW_HTTP_REDIRECT_TO_HTTPS=true

      # Temporal Configuration
      - WATERFLOW_TEMPORAL_HOST=temporal:7233
      - WATERFLOW_TEMPORAL_NAMESPACE=default
      - WATERFLOW_TEMPORAL_TASK_QUEUE=waterflow-server

      # Logging
      - WATERFLOW_LOG_LEVEL=info
      - WATERFLOW_LOG_FORMAT=json
    depends_on:
      temporal:
        condition: service_healthy
    networks:
      - waterflow

  # Waterflow Agent (Example)
  waterflow-agent:
    image: waterflow/agent:latest
    environment:
      # Agent Configuration
      - WATERFLOW_AGENT_TASK_QUEUES=linux-amd64,linux-common
      - WATERFLOW_AGENT_PLUGIN_DIR=/opt/waterflow/plugins

      # Temporal Configuration
      - WATERFLOW_TEMPORAL_HOST=temporal:7233
      - WATERFLOW_TEMPORAL_NAMESPACE=default

      # Logging
      - WATERFLOW_LOG_LEVEL=info
      - WATERFLOW_LOG_FORMAT=json
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      temporal:
        condition: service_healthy
      waterflow-server:
        condition: service_started
    networks:
      - waterflow

networks:
  waterflow:
    driver: bridge

volumes:
  postgresql-data:
