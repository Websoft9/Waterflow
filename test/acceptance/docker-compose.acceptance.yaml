# Docker Compose configuration for acceptance testing
# Multi-agent environment simulating distributed server deployment
# Usage: docker compose -f test/acceptance/docker-compose.acceptance.yaml up -d

services:
  # PostgreSQL Database
  postgresql:
    image: postgres:16
    container_name: acceptance-postgresql
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
    ports:
      - "15432:5432"
    networks:
      - acceptance-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-temporal}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  # Temporal Admin Tools - 用于数据库初始化
  temporal-admin-tools:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    container_name: acceptance-temporal-admin-tools
    restart: on-failure:6
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgresql
    networks:
      - acceptance-network
    volumes:
      - ../../deployments/scripts:/scripts
    entrypoint: [ "/bin/sh" ]
    command: /scripts/setup-postgres.sh

  # Temporal Server
  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.29.2}
    container_name: acceptance-temporal
    depends_on:
      postgresql:
        condition: service_healthy
      temporal-admin-tools:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-temporal}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-temporal}
      POSTGRES_SEEDS: postgresql
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "17233:7233"
    volumes:
      - ../../deployments/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    networks:
      - acceptance-network
    healthcheck:
      test: [ "CMD", "nc", "-z", "localhost", "7233" ]
      interval: 5s
      timeout: 5s
      retries: 30

  # Temporal Namespace Creation
  temporal-create-namespace:
    image: temporalio/admin-tools:${TEMPORAL_ADMINTOOLS_VERSION:-1.29.1-tctl-1.18.4-cli-1.5.0}
    container_name: acceptance-temporal-create-namespace
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: ${WATERFLOW_TEMPORAL_NAMESPACE:-default}
    volumes:
      - ../../deployments/scripts:/scripts:ro
    entrypoint: /scripts/create-namespace.sh
    networks:
      - acceptance-network

  # Waterflow Server
  waterflow-server:
    build:
      context: ../..
      dockerfile: build/Dockerfile.server
    image: waterflow/server:acceptance
    container_name: acceptance-server
    depends_on:
      temporal-create-namespace:
        condition: service_completed_successfully
    environment:
      # Database Configuration
      WATERFLOW_DB_HOST: ${WATERFLOW_DB_HOST:-postgresql}
      WATERFLOW_DB_PORT: ${WATERFLOW_DB_PORT:-5432}
      WATERFLOW_DB_NAME: ${WATERFLOW_DB_NAME:-waterflow}
      WATERFLOW_DB_USER: ${WATERFLOW_DB_USER:-temporal}
      WATERFLOW_DB_PASSWORD: ${WATERFLOW_DB_PASSWORD:-temporal}
      WATERFLOW_DB_SSLMODE: ${WATERFLOW_DB_SSLMODE:-disable}
      # Temporal Configuration
      WATERFLOW_TEMPORAL_HOST: ${WATERFLOW_TEMPORAL_HOST:-temporal:7233}
      WATERFLOW_TEMPORAL_NAMESPACE: ${WATERFLOW_TEMPORAL_NAMESPACE:-default}
      WATERFLOW_TEMPORAL_TASKQUEUE: ${WATERFLOW_TEMPORAL_TASKQUEUE:-waterflow-server}
      WATERFLOW_LOG_LEVEL: ${WATERFLOW_LOG_LEVEL:-info}
      WATERFLOW_LOG_FORMAT: ${WATERFLOW_LOG_FORMAT:-json}
    ports:
      - "18080:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - acceptance-network

  # Agent 1: Web Server 1 (linux-amd64 task queue)
  agent-web-1:
    build:
      context: ../..
      dockerfile: build/Dockerfile.agent
    image: waterflow/agent:acceptance
    container_name: acceptance-agent-web-1
    hostname: web-server-1
    depends_on:
      waterflow-server:
        condition: service_healthy
    environment:
      WATERFLOW_AGENT_ID: agent-web-1
      WATERFLOW_TEMPORAL_HOST: temporal:7233
      WATERFLOW_TEMPORAL_NAMESPACE: default
      WATERFLOW_AGENT_TASK_QUEUES: linux-amd64,linux-common
      WATERFLOW_LOG_LEVEL: info
      WATERFLOW_LOG_FORMAT: json
      # Simulate server metrics
      SERVER_CPU_PERCENT: "45"
      SERVER_MEMORY_PERCENT: "62"
      SERVER_DISK_PERCENT: "58"
    networks:
      - acceptance-network

  # Agent 2: Web Server 2 (linux-amd64 task queue)
  agent-web-2:
    build:
      context: ../..
      dockerfile: build/Dockerfile.agent
    image: waterflow/agent:acceptance
    container_name: acceptance-agent-web-2
    hostname: web-server-2
    depends_on:
      waterflow-server:
        condition: service_healthy
    environment:
      WATERFLOW_AGENT_ID: agent-web-2
      WATERFLOW_TEMPORAL_HOST: temporal:7233
      WATERFLOW_TEMPORAL_NAMESPACE: default
      WATERFLOW_AGENT_TASK_QUEUES: linux-amd64,linux-common
      WATERFLOW_LOG_LEVEL: info
      WATERFLOW_LOG_FORMAT: json
      # Simulate server metrics
      SERVER_CPU_PERCENT: "78"
      SERVER_MEMORY_PERCENT: "85"
      SERVER_DISK_PERCENT: "72"
    networks:
      - acceptance-network

  # Agent 3: DB Server (db-server task queue)
  agent-db-1:
    build:
      context: ../..
      dockerfile: build/Dockerfile.agent
    image: waterflow/agent:acceptance
    container_name: acceptance-agent-db-1
    hostname: db-server-1
    depends_on:
      waterflow-server:
        condition: service_healthy
    environment:
      WATERFLOW_AGENT_ID: agent-db-1
      WATERFLOW_TEMPORAL_HOST: temporal:7233
      WATERFLOW_TEMPORAL_NAMESPACE: default
      WATERFLOW_AGENT_TASK_QUEUES: db-server
      WATERFLOW_LOG_LEVEL: info
      WATERFLOW_LOG_FORMAT: json
      # Simulate server metrics
      SERVER_CPU_PERCENT: "32"
      SERVER_MEMORY_PERCENT: "55"
      SERVER_DISK_PERCENT: "48"
    networks:
      - acceptance-network

  # Mock App for deployment testing
  mock-app:
    build:
      context: ./testdata/mock-app
      dockerfile: Dockerfile
    image: waterflow/mock-app:acceptance
    container_name: acceptance-mock-app
    ports:
      - "18081:8080"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 3s
      timeout: 2s
      retries: 10
    networks:
      - acceptance-network
    profiles:
      - deploy-test

networks:
  acceptance-network:
    name: acceptance-network
    driver: bridge
