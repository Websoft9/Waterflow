# PostgreSQL Docker Compose Configuration
# =========================================
# This file is an OPTIONAL alternative to the docker/exec approach
# used in distributed-stack-deployment.yaml template.
#
# Usage: Copy this file to your deployment server and modify vars.db_compose_file
# to point to this file, then change the deploy step to use docker/compose node.
#
# Example:
#   vars:
#     db_compose_file: "/opt/configs/db-compose.yml"
#   steps:
#     - uses: docker/compose@v1
#       with:
#         file: ${{ vars.db_compose_file }}
#         action: up
#         args: "-d"

version: '3.8'

services:
  postgres:
    image: ${POSTGRES_VERSION:-postgres:14}
    container_name: postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-myapp}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-appuser}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
