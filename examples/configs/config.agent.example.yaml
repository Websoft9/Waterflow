# Waterflow Agent 配置示例

# Agent 基本配置
agent:
  # Agent 唯一标识符 (可选)
  # 环境变量: WATERFLOW_AGENT_ID
  # 如果不设置，Agent 将使用 Temporal Worker 的默认标识符
  id: "agent-build-server-1"
  
  # Agent 监听的 Task Queue 列表 (必填)
  # 环境变量: WATERFLOW_AGENT_TASK_QUEUES (逗号分隔)
  task_queues:
    - "linux-amd64"
    - "linux-common"
  
  # Plugin 目录
  # 环境变量: WATERFLOW_AGENT_PLUGIN_DIR
  plugin_dir: "/opt/waterflow/plugins"
  
  # 是否自动重载插件
  # 环境变量: WATERFLOW_AGENT_AUTO_RELOAD_PLUGINS
  auto_reload_plugins: false
  
  # Metrics 端口
  # 环境变量: WATERFLOW_AGENT_METRICS_PORT
  metrics_port: "9090"
  
  # 优雅关闭超时时间
  # 环境变量: WATERFLOW_AGENT_SHUTDOWN_TIMEOUT
  shutdown_timeout: "30s"

# Temporal 连接配置
temporal:
  # Temporal Server 地址 (必填)
  # 环境变量: WATERFLOW_TEMPORAL_HOST
  host: "localhost:7233"
  
  # Temporal Namespace
  # 环境变量: WATERFLOW_TEMPORAL_NAMESPACE
  namespace: "default"
  
  # 连接超时时间
  # 环境变量: WATERFLOW_TEMPORAL_CONNECTION_TIMEOUT
  connection_timeout: "10s"
  
  # 最大重试次数
  # 环境变量: WATERFLOW_TEMPORAL_MAX_RETRIES
  max_retries: 10
  
  # 重试间隔
  # 环境变量: WATERFLOW_TEMPORAL_RETRY_INTERVAL
  retry_interval: "5s"

# 日志配置
log:
  # 日志级别: debug, info, warn, error
  # 环境变量: WATERFLOW_LOG_LEVEL
  level: "info"
  
  # 日志格式: json, text
  # 环境变量: WATERFLOW_LOG_FORMAT
  format: "json"
  
  # 日志输出: stdout, stderr
  # 环境变量: WATERFLOW_LOG_OUTPUT
  output: "stdout"

# 环境变量使用示例:
# ==========================================
# export WATERFLOW_AGENT_TASK_QUEUES=linux-amd64,linux-common
# export WATERFLOW_TEMPORAL_HOST=localhost:7233
# export WATERFLOW_TEMPORAL_NAMESPACE=default
# export WATERFLOW_LOG_LEVEL=info
# export WATERFLOW_AGENT_PLUGIN_DIR=/opt/waterflow/plugins
# export WATERFLOW_AGENT_METRICS_PORT=9090
# 
# 启动命令:
# ./bin/agent --config config.agent.yaml
