# ========================================
# Workflow: Shell Command Examples
# Story: 10.5 - 工作流示例库
# ========================================
#
# 用途: 演示 exec/shell 节点的各种用法
#
# 前置条件:
# - Waterflow Server 和 Agent 运行中
# - Agent 注册到 linux-amd64 队列
#
# 参数:
# - 无需额外参数，开箱即用
#
# 运行方式:
# waterflow submit examples/workflows/shell-examples.yaml
#
# 预期输出:
# - Job 1: 基础 Shell 命令（echo, uname, ls）
# - Job 2: 环境变量使用
# - Job 3: 工作目录操作
# - Job 4: 错误处理和超时控制
# ========================================

name: Shell Node Examples

jobs:
  basic-commands:
    name: Basic Shell Commands
    runs-on: linux-amd64
    steps:
      - name: Simple echo
        uses: exec/shell@v1
        with:
          command: echo "Hello Waterflow"
      
      - name: Check system info
        uses: exec/shell@v1
        with:
          command: uname -a
      
      - name: List files
        uses: exec/shell@v1
        with:
          command: ls
          args: ["-la", "/tmp"]
          timeout: 10

  environment-variables:
    name: Environment Variables
    runs-on: linux-amd64
    steps:
      - name: Use custom env
        uses: exec/shell@v1
        with:
          command: echo "API_KEY=$API_KEY"
          env:
            API_KEY: "secret-key-123"
            ENV: "production"

  working-directory:
    name: Working Directory
    runs-on: linux-amd64
    steps:
      - name: Create temp file
        uses: exec/shell@v1
        with:
          command: touch test.txt
          workdir: /tmp
      
      - name: Verify file exists
        uses: exec/shell@v1
        with:
          command: ls test.txt
          workdir: /tmp

  error-handling:
    name: Error Handling
    runs-on: linux-amd64
    steps:
      - name: Timeout example
        uses: exec/shell@v1
        with:
          command: sleep 100
          timeout: 5
        continue-on-error: true
      
      - name: Command failure
        uses: exec/shell@v1
        with:
          command: exit 1
        continue-on-error: true
      
      - name: This step runs anyway
        uses: exec/shell@v1
        with:
          command: echo "Execution continues"
