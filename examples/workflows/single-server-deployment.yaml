# yaml-language-server: $schema=../../pkg/dsl/schema/workflow-schema.json
# ====================================================================================================
# Single Server Deployment Template
# ====================================================================================================
#
# 用途: 部署应用到单台服务器,包含构建、健康检查、回滚功能
# 适用场景: 简单应用、MVP产品、开发/测试环境
#
# ====================================================================================================
# 必需参数:
# ====================================================================================================
#   repo_url: Git 仓库地址 (例如: https://github.com/user/app.git)
#   app_name: 应用名称,用于容器/进程命名 (例如: my-app)
#
# ====================================================================================================
# 可选参数 (含默认值):
# ====================================================================================================
#   app_port: 应用监听端口 (默认: 3000)
#   branch: Git 分支 (默认: main)
#   deploy_path: 部署目录 (默认: /opt/{app_name})
#   health_check_url: 健康检查URL (默认: http://localhost:{app_port}/health)
#
# ⚠️ 重要提示:
# ====================================================================================================
#   健康检查重试策略已在YAML中硬编码为:
#     - max-attempts: 5 (重试5次)
#     - initial-interval: 10s (每次间隔10秒)
#   
#   max-attempts 必须是1-100之间的整数常量,不支持变量插值。
#   如需修改重试次数,请直接编辑步骤中的 retry-strategy.max-attempts 值。
#
# ====================================================================================================
# 前置条件:
# ====================================================================================================
#   - Waterflow Agent 已安装并运行
#   - Agent 服务器已安装 Git 和 Docker
#   - 应用仓库可访问 (公开仓库或已配置凭证)
#   - 端口未被占用
#
# ====================================================================================================
# 快速开始:
# ====================================================================================================
#   1. 复制此模板:
#      cp examples/workflows/single-server-deployment.yaml my-app-deployment.yaml
#
#   2. 修改 vars 部分的 repo_url 和 app_name:
#      vars:
#        repo_url: "https://github.com/your-org/your-app.git"
#        app_name: "your-app"
#
#   3. 提交工作流:
#      waterflow submit my-app-deployment.yaml
#      # 或使用 API:
#      curl -X POST http://localhost:8080/v1/workflows \
#        -H "Content-Type: application/json" \
#        -d @my-app-deployment.yaml
#
#   4. 查看状态:
#      waterflow status <workflow-id>
#
# ====================================================================================================
# 部署流程:
# ====================================================================================================
#   1. Clone/Pull 代码仓库
#   2. 构建 Docker 镜像
#   3. 备份旧版本容器ID (用于回滚)
#   4. 停止旧版本容器
#   5. 启动新版本容器
#   6. 健康检查 (带重试)
#   7. 失败时回滚到旧版本
#
# ====================================================================================================
# 使用场景示例:
# ====================================================================================================
#
# 场景 1: 部署 Node.js Express 应用
# -----------------------------------
# vars:
#   repo_url: "https://github.com/expressjs/express.git"
#   app_name: "express-app"
#   app_port: "3000"
#   health_check_url: "http://localhost:3000/health"
#
# 场景 2: 部署 Python Flask 应用
# -------------------------------
# vars:
#   repo_url: "https://github.com/pallets/flask.git"
#   app_name: "flask-app"
#   app_port: "5000"
#   health_check_url: "http://localhost:5000/health"
#
# 场景 3: 部署到特定分支
# ----------------------
# vars:
#   repo_url: "https://github.com/user/app.git"
#   app_name: "my-app"
#   branch: "develop"
#   deploy_path: "/opt/my-app-dev"
#
# ====================================================================================================

name: Single Server Deployment

vars:
  # ===== Required Parameters =====
  repo_url: "https://github.com/user/app.git"  # 修改为你的仓库地址
  app_name: "my-app"                            # 修改为你的应用名称
  
  # ===== Optional Parameters (with defaults) =====
  app_port: "3000"                                              # 应用监听端口
  branch: "main"                                                # Git 分支
  deploy_path: "/opt/my-app"                                   # 部署目录 (建议修改为实际路径)
  health_check_url: "http://localhost:${{ vars.app_port }}/health"  # 健康检查URL

jobs:
  deploy:
    runs-on: production-server  # 修改为你的服务器标签/Task Queue名称
    
    steps:
      # ========================================
      # Step 1: Clone or Pull Repository
      # ========================================
      - name: Clone or pull repository
        uses: exec/shell@v1
        with:
          command: |
            if [ -d "${{ vars.deploy_path }}" ]; then
              echo "Repository exists, pulling latest changes..."
              cd ${{ vars.deploy_path }} && git pull origin ${{ vars.branch }}
            else
              echo "Repository not found, cloning..."
              git clone --depth 1 -b ${{ vars.branch }} ${{ vars.repo_url }} ${{ vars.deploy_path }}
            fi
        timeout-minutes: 5
      
      # ========================================
      # Step 2: Build Docker Image
      # ========================================
      - name: Build Docker image
        uses: exec/shell@v1
        with:
          command: |
            echo "Building Docker image..."
            docker build -t ${{ vars.app_name }}:${{ vars.branch }} ${{ vars.deploy_path }}
        timeout-minutes: 10
      
      # Alternative: Script Build (uncomment if not using Docker)
      # ========================================
      # - name: Build with script
      #   uses: exec/script@v1
      #   with:
      #     script_path: ${{ vars.deploy_path }}/build.sh
      #   timeout-minutes: 10
      
      # ========================================
      # Step 3: Backup Old Version (for rollback)
      # ========================================
      - name: Backup old version container ID
        uses: exec/shell@v1
        with:
          command: |
            echo "Backing up old version container ID..."
            docker ps --filter "name=${{ vars.app_name }}" --format "{{.ID}}" > /tmp/old_${{ vars.app_name }}.txt || echo "none" > /tmp/old_${{ vars.app_name }}.txt
            OLD_ID=$(cat /tmp/old_${{ vars.app_name }}.txt)
            echo "Old container ID: $OLD_ID"
      
      # ========================================
      # Step 4: Stop Old Version
      # ========================================
      - name: Stop old version container
        uses: exec/shell@v1
        with:
          command: |
            echo "Stopping old version container..."
            docker stop ${{ vars.app_name }} || echo "No container to stop (first deployment or already stopped)"
      
      # ========================================
      # Step 5: Start New Version
      # ========================================
      - name: Start new version container
        uses: exec/shell@v1
        with:
          command: |
            echo "Starting new version container..."
            docker run -d --name ${{ vars.app_name }} \
              -p ${{ vars.app_port }}:8080 \
              ${{ vars.app_name }}:${{ vars.branch }}
      
      # ========================================
      # Step 6: Health Check with Retry
      # ========================================
      - name: Health check new version
        uses: http/request@v1
        with:
          url: ${{ vars.health_check_url }}
          method: GET
        timeout-minutes: 1
        retry-strategy:
          max-attempts: 5
          initial-interval: 10s
          backoff-coefficient: 1.0
          max-interval: 10s
        continue-on-error: true
      
      # ========================================
      # Step 7: Rollback on Failure
      # ========================================
      - name: Rollback on health check failure
        if: ${{ failure() }}
        uses: exec/shell@v1
        with:
          command: |
            echo "========================================"
            echo "Health check failed! Rolling back..."
            echo "========================================"
            
            # Check if backup file exists
            if [ ! -f /tmp/old_${{ vars.app_name }}.txt ]; then
              echo "ERROR: No backup file found, cannot rollback"
              echo "Cleaning up failed deployment..."
              docker stop ${{ vars.app_name }} || true
              docker rm ${{ vars.app_name }} || true
              exit 1
            fi
            
            OLD_ID=$(cat /tmp/old_${{ vars.app_name }}.txt)
            echo "Old container ID from backup: $OLD_ID"
            
            # Check if first deployment (no old version)
            if [ "$OLD_ID" == "none" ]; then
              echo "First deployment failed, no old version to rollback to"
              echo "Cleaning up failed deployment..."
              docker stop ${{ vars.app_name }} || true
              docker rm ${{ vars.app_name }} || true
              exit 1
            fi
            
            # Rollback to old version
            echo "Rolling back to old version..."
            
            # Stop and remove failed new version
            docker stop ${{ vars.app_name }} || true
            docker rm ${{ vars.app_name }} || true
            
            # Restart old version
            docker start $OLD_ID
            
            # Rename old container back to app name
            docker rename $OLD_ID ${{ vars.app_name }} || true
            
            echo "========================================"
            echo "Rollback completed successfully"
            echo "Old version is now running"
            echo "========================================"
            
            # Exit with error to mark workflow as failed
            exit 1
