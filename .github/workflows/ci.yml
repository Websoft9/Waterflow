name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Full history for version tags

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.24'

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Run linters
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

    - name: Run unit tests
      run: make test
      # Note: Integration tests requiring Temporal are excluded (-short flag)
      # They will be added back when infrastructure is set up

    - name: Generate coverage report
      run: make coverage

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.html

    - name: Build server binary
      run: make build

    - name: Build agent binary
      run: make build-agent

    - name: Verify binaries
      run: |
        ./bin/server --version || echo "Server binary built successfully"
        ./bin/agent --version || echo "Agent binary built successfully"

    - name: Upload binaries to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: |
          bin/server
          bin/agent

