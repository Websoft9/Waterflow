name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  GO_VERSION: '1.24'

jobs:
  # Stage 1: Lint (fast feedback)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@v6
      with:
        version: latest
        args: --timeout=5m

  # Stage 1: Security scan (parallel with lint)
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

  # Stage 2: Unit tests (after lint passes)
  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod download

    - name: Run unit tests
      run: make test

    - name: Generate coverage report
      run: make coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        flags: unittests
        name: waterflow-coverage
        fail_ci_if_error: false
        verbose: true

    - name: Upload coverage to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: |
          coverage.html
          coverage.out

  # Stage 2: Build (parallel with unit tests, after lint and security pass)
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, security]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Build server binary
      run: make build

    - name: Build agent binary
      run: make build-agent

    - name: Build CLI binary
      run: make cli

    - name: Verify binaries
      run: |
        ./bin/server --version || echo "Server binary built successfully"
        ./bin/agent --version || echo "Agent binary built successfully"
        ./bin/waterflow version || echo "CLI binary built successfully"

    - name: Upload binaries to artifacts
      uses: actions/upload-artifact@v4
      with:
        name: binaries
        path: |
          bin/server
          bin/agent
          bin/waterflow

  # Stage 3: Integration tests (requires successful build)
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [unit-test, build]
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Start test environment
      run: |
        docker compose -f deployments/docker-compose.test.yaml up -d
        echo "Waiting for services to be healthy..."
        
        # Wait for PostgreSQL (service name is 'postgresql' in docker-compose.test.yaml)
        timeout 60 bash -c 'until docker compose -f deployments/docker-compose.test.yaml exec -T postgresql pg_isready -U temporal; do sleep 2; done'
        
        # Wait for Temporal (check via docker exec since it's not exposed externally)
        timeout 90 bash -c 'until docker compose -f deployments/docker-compose.test.yaml exec -T temporal sh -c "nc -z localhost 7233"; do sleep 3; done'
        
        # Wait for Server
        timeout 60 bash -c 'until curl -sf http://localhost:18080/health > /dev/null 2>&1; do sleep 2; done'
        
        echo "All services are healthy"

    - name: Run integration tests
      run: |
        go test -v -tags integration -timeout 10m ./test/integration/... 2>&1 | tee integration-test-output.txt
      env:
        WATERFLOW_TEST_URL: http://localhost:18080
        SERVER_URL: http://localhost:18080
        WATERFLOW_AGENT_URL: http://localhost:18081

    - name: Collect service logs on failure
      if: failure()
      run: |
        mkdir -p logs
        docker compose -f deployments/docker-compose.test.yaml logs waterflow-server > logs/server.log 2>&1 || true
        docker compose -f deployments/docker-compose.test.yaml logs waterflow-agent > logs/agent.log 2>&1 || true
        docker compose -f deployments/docker-compose.test.yaml logs temporal > logs/temporal.log 2>&1 || true
        docker compose -f deployments/docker-compose.test.yaml logs postgresql > logs/postgres.log 2>&1 || true

    - name: Upload logs artifact
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-logs
        path: |
          logs/
          integration-test-output.txt
        retention-days: 7

    - name: Stop test environment
      if: always()
      run: docker compose -f deployments/docker-compose.test.yaml down -v

  # Stage 4: Acceptance tests (requires integration tests to pass)
  acceptance-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: integration-tests
    timeout-minutes: 25
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}

    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Start acceptance test environment
      run: |
        docker compose -f test/acceptance/docker-compose.acceptance.yaml up -d --build
        echo "Waiting for services to be healthy..."
        
        # Wait for PostgreSQL
        timeout 60 bash -c 'until docker compose -f test/acceptance/docker-compose.acceptance.yaml exec -T postgres pg_isready; do sleep 2; done'
        
        # Wait for Temporal (with explicit failure on timeout)
        echo "Waiting for Temporal..."
        if ! timeout 120 bash -c 'until curl -sf http://localhost:17233/health > /dev/null 2>&1; do sleep 3; done'; then
          echo "ERROR: Temporal failed to become healthy within 120s"
          docker compose -f test/acceptance/docker-compose.acceptance.yaml logs temporal
          exit 1
        fi
        
        # Wait for Server
        timeout 90 bash -c 'until curl -sf http://localhost:18080/health > /dev/null 2>&1; do sleep 3; done'
        
        # Wait for Agents to register
        sleep 15
        
        echo "All services are healthy"

    - name: Run acceptance tests
      run: |
        mkdir -p test/acceptance/reports
        SERVER_URL=http://localhost:18080 \
        TEMPORAL_HOST=localhost:17233 \
        go test -v -tags acceptance -timeout 15m ./test/acceptance/... 2>&1 | tee test/acceptance/reports/test-output.txt
      env:
        SERVER_URL: http://localhost:18080
        TEMPORAL_HOST: localhost:17233

    - name: Collect service logs on failure
      if: failure()
      run: |
        mkdir -p logs
        docker compose -f test/acceptance/docker-compose.acceptance.yaml logs waterflow-server > logs/acceptance-server.log 2>&1 || true
        docker compose -f test/acceptance/docker-compose.acceptance.yaml logs agent-web-1 > logs/acceptance-agent-web-1.log 2>&1 || true
        docker compose -f test/acceptance/docker-compose.acceptance.yaml logs agent-web-2 > logs/acceptance-agent-web-2.log 2>&1 || true
        docker compose -f test/acceptance/docker-compose.acceptance.yaml logs agent-db-1 > logs/acceptance-agent-db-1.log 2>&1 || true
        docker compose -f test/acceptance/docker-compose.acceptance.yaml logs temporal > logs/acceptance-temporal.log 2>&1 || true

    - name: Upload acceptance test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: acceptance-test-report
        path: |
          test/acceptance/reports/
          logs/
        retention-days: 14

    - name: Stop acceptance test environment
      if: always()
      run: docker compose -f test/acceptance/docker-compose.acceptance.yaml down -v
